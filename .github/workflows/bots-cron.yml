name: Trigger ArrowDEX trading bots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Call bots endpoint
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -X GET "https://arrowdex.vercel.app/api/bots/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
